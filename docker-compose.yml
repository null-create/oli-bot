services:
  api:
    image: oli-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oli-api
    env_file: .env
    environment:
      - OLI_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLI_LOG_FILE=/app/logs/backend.ndjson
    ports:
      - "9734:9734"
    restart: "no"
    working_dir: /app
    volumes:
      - ./oli_bot/profiles:/usr/local/lib/python3.12/site-packages/oli_bot/profiles
      - ~/.config/oli:/.config/oli
      - oli-logs:/app/logs

volumes:
  oli-logs:

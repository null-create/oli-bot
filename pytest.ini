[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    integration: end-to-end tests that cross real protocol/process boundaries (mock OpenAI/Ollama/MCP servers, real subprocesses)
    process: tests that boot real subprocess entrypoints (oli-server)
filterwarnings =
    ignore::DeprecationWarning:ollama.*
    ignore::DeprecationWarning:mcp.*